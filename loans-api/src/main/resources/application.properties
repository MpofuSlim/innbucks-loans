springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.jpa.open-in-view=false

# --- Cross-channel security & idempotency engine ---------------------------
# Modes: DISABLED | MONITOR | ENFORCE.
# MONITOR (default) verifies, audits and replays idempotent responses but never
# rejects — existing traffic is unaffected. Flip to ENFORCE per environment
# once every channel gateway signs its requests (docs/integration/channel-signing.js).
channel-security.mode=${CHANNEL_SECURITY_MODE:MONITOR}
channel-security.clock-skew=${CHANNEL_SECURITY_CLOCK_SKEW:5m}
channel-security.idempotency-ttl=${CHANNEL_SECURITY_IDEMPOTENCY_TTL:24h}
channel-security.velocity-limit=${CHANNEL_SECURITY_VELOCITY_LIMIT:50}
channel-security.velocity-window=${CHANNEL_SECURITY_VELOCITY_WINDOW:60s}
# Per-channel HMAC secrets — supply via env/vault, never commit values:
#channel-security.secrets.whatsapp_gateway=${CHANNEL_SECRET_WHATSAPP:}
#channel-security.secrets.admin_portal=${CHANNEL_SECRET_ADMIN_PORTAL:}

# --- Bulk ingestion pipeline ------------------------------------------------
bulk-ingestion.chunk-size=${BULK_INGESTION_CHUNK_SIZE:100}
bulk-ingestion.max-batch-size=${BULK_INGESTION_MAX_BATCH_SIZE:5000}


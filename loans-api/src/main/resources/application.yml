server:
  # 8088 is loans-service's port in the fleet cell too (k8s Service, containerPort, probes and every
  # copy of the fleet's discovery map), so the packaged default and the cell agree without an override.
  port: ${SERVER_PORT:8088}
  error:
    whitelabel:
      enabled: false
  # Deliberately none, not left unset. Unset, Boot turns on Tomcat's forwarded-header handling by
  # itself whenever it detects a cloud platform, and it detects Kubernetes from the pod's env. Tomcat
  # would then take the client address out of X-Forwarded-For and rewrite that header, so the signing
  # evidence (SigningContexts: the address "as this server saw it", the chain "as received") would mean
  # one thing on the box and another in the cell. The Swagger server is set explicitly (OpenApiConfig)
  # and nothing here builds a URL from the request, so nothing needs the headers.
  forward-headers-strategy: none

spring:
  profiles:
    active: api

  # --- PostgreSQL ---
  # The fleet's variable names, so the cell's loans-service Deployment sets these exactly as it does for
  # every other service. The defaults are the local development database.
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/innbucks_loans}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:19}
      minimum-idle: ${DB_POOL_MIN:7}
      data-source-properties:
        stringtype: unspecified

  # The schema is Flyway's (loans-core db/migration); Hibernate only checks it
  # matches. JpaSchemaConfig enforces validate and the naming in code, because
  # a file in /app/config can still override anything set here.
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 1000

  # --- @Scheduled jobs: ONE thread, deliberately --------------------------
  # Boot's default, pinned so it is not raised without redoing this audit. A
  # pool > 1 never overlaps a job with itself, but it does run DIFFERENT jobs
  # at once, and the jobs are only safe today because they are serial:
  #  - LoanBookingJob books with InnBucks (which pays on booking) and
  #    saves the loan OUTSIDE its per-loan try. A version conflict on that save
  #    (Loan is @Version-locked) loses the booking's outcome, aborts the run
  #    and leaves the loan account-PENDING, so the next run books it again.
  #    LoanSagaOrchestrator (every 60s, every loan of the last 30 days) writes
  #    Loan rows when it compensates a FAILED disbursement, and a loan that a
  #    Ndasenda response rewound to account PENDING before #82 is in both row
  #    sets. Serial, the saga cannot write a loan the booking job is holding.
  #  - LoanDisbursementStatusJob (account CREATED, disbursement PENDING) also
  #    saves outside its try, after it has SMSed the customer; the Ndasenda
  #    response job (PROCESSING, or FAILED but lodged) can hold the same
  #    rewound rows.
  #  - NdasendaLodgementJob lodges into the open Ndasenda batch that
  #    NdasendaDeductionBatchCommitJob commits, and neither token cache
  #    is synchronised; how Ndasenda and InnBucks treat those races is
  #    unverified.
  #  - NdasendaLodgementJob (NEW loans) shares no rows with another job.
  # Optimistic locking turns an overlap into a failure rather than a lost
  # update, but on the booking path that failure means booking twice. What
  # bounds how long one call can hold the other jobs back is http.client
  # below, not this pool.
  task:
    scheduling:
      pool:
        size: 1

# --- Self-issued JWT authentication ----------------------------------------
# Tokens are signed and validated with a shared HS256 secret; the platform is
# its own issuer (no external identity provider), and a token whose iss is not
# jwt.issuer is rejected. JWT_SECRET must be at least 32 bytes and MUST be
# supplied in every deployed environment: the default below is a public
# placeholder, and the app refuses to boot on it unless a dev/test/local/it
# profile is active.
jwt:
  secret: "${JWT_SECRET:innbucks-loans-local-dev-secret-change-me-please}"
  expiration: "${JWT_EXPIRATION_MS:86400000}"
  issuer: "${JWT_ISSUER:innbucks-loans}"

# --- Bootstrap super-admin ---------------------------------------------------
# Created once, on the first boot where no user with this username exists. With
# no password and no dev/test/local/it profile, NO admin is created (an ERROR is
# logged); set BOOTSTRAP_ADMIN_PASSWORD, or bootstrap.admin.password in /app/config.
bootstrap:
  admin:
    username: "${BOOTSTRAP_ADMIN_USERNAME:admin}"
    password: "${BOOTSTRAP_ADMIN_PASSWORD:}"

# --- Outbound HTTP timeouts (milliseconds) ----------------------------------
# One RestTemplate carries every Ndasenda call (login, lodgement, batch commit,
# responses) and every InnBucks call (login, loan booking, inquiry, deposit).
# It used to have no timeouts at all, so one hung upstream froze the scheduler
# thread and with it every job. Both values must be > 0: 0 would mean "wait
# forever", and the app refuses to boot on it. A job still makes its calls one
# after another (login, call, one replay after a 401, per loan), so a slow
# upstream delays the other jobs by up to that many times these values.
#
# connect-timeout, 10s: nothing has been sent until the connection is up, so
#   this only has to outlast a slow handshake. 10s rides out up to three lost
#   SYNs (the kernel resends at 1s, 3s and 7s) and replaces the OS default of
#   about two minutes. Shorter would fail more often, not more safely: the
#   booking job holds a loan whose call cannot connect as AMBIGUOUS too.
# read-timeout, 60s: generous on purpose. A read timeout on a WRITE means the
#   request left and its answer did not come back, so its outcome is unknown.
#   An InnBucks booking is then held AMBIGUOUS (and InnBucks pays on booking),
#   a manual deposit is held IN_DOUBT and blocks every further payout of that
#   loan, and a Ndasenda lodgement is marked FAILED while its deduction may be
#   live. Each of those waits on an operator, so a tight read timeout turns
#   calls that were merely slow into held loans.
http:
  client:
    connect-timeout: "${HTTP_CLIENT_CONNECT_TIMEOUT_MS:10000}"
    read-timeout: "${HTTP_CLIENT_READ_TIMEOUT_MS:60000}"

# Uploaded documents (FR-SSB-005): what a payslip, national ID or signature must meet to be accepted.
# The defaults refuse what cannot be read, not what is merely imperfect. Accepted images are logged with
# their measured contrast and sharpness, which is what to tune these against.
loans:
  documents:
    max-size-bytes: "${DOCUMENT_MAX_SIZE_BYTES:5242880}"
    max-pdf-pages: "${DOCUMENT_MAX_PDF_PAGES:10}"
    min-document-short-side-px: "${DOCUMENT_MIN_SHORT_SIDE_PX:600}"
    min-signature-short-side-px: "${DOCUMENT_MIN_SIGNATURE_SHORT_SIDE_PX:30}"
    max-image-pixels: "${DOCUMENT_MAX_IMAGE_PIXELS:40000000}"
    min-contrast: "${DOCUMENT_MIN_CONTRAST:5.0}"
    min-sharpness: "${DOCUMENT_MIN_SHARPNESS:20.0}"
  # Saved applications (FR-SSB-002). An open draft holds the applicant's ID and payslip, so one not saved
  # for expiry-days is deleted, by a daily job on the scheduled-tasks instance.
  drafts:
    expiry-days: "${DRAFT_EXPIRY_DAYS:30}"
    expiry-cron: "${DRAFT_EXPIRY_CRON:0 30 1 * * *}"
  # Staff Grocery Loan offers (FR-SGL-015, FR-SGL-018). The weekly run fires on run-cron (second minute hour day
  # month weekday), read on the market's clock, only where the scheduled-tasks profile is on; a run can always be
  # started from the admin portal. Offers stay open validity-days. A run is refused when the staff register's latest
  # payroll reconciliation is more than max-reconciliation-age-days old.
  staff-offers:
    run-cron: "${STAFF_OFFERS_RUN_CRON:0 0 8 * * MON}"
    validity-days: "${STAFF_OFFERS_VALIDITY_DAYS:7}"
    max-reconciliation-age-days: "${STAFF_OFFERS_MAX_RECONCILIATION_AGE_DAYS:35}"
    # Offer and launch messages (FR-SGL-019 to 023): SMS through innbucks-notify, WhatsApp when the SMS fails.
    notifications:
      # The frequency cap: after this many offers in a row left unanswered, a member is messaged only every
      # capped-reminder-weeks (0: not at all while the run of ignored offers lasts). Offers still show in-app.
      ignored-offers-before-cap: "${STAFF_NOTIFICATIONS_IGNORED_OFFERS_BEFORE_CAP:3}"
      capped-reminder-weeks: "${STAFF_NOTIFICATIONS_CAPPED_REMINDER_WEEKS:4}"
      # Paces the launch broadcast and the weekly run's messages (FR-GEN-007); 0 sends without pause.
      messages-per-second: "${STAFF_NOTIFICATIONS_MESSAGES_PER_SECOND:5}"
      # How often the scheduled-tasks profile picks up messages left PENDING by a stop.
      sweep-interval: "${STAFF_NOTIFICATIONS_SWEEP_INTERVAL:PT5M}"
  # In a Kubernetes pod the scheduled-tasks profile alone refuses to boot (ScheduledTasksKubernetesGuard):
  # the fleet cell runs loans with the jobs OFF, and a Secret entry such as SPRING_PROFILES_INCLUDE could
  # otherwise switch on InnBucks booking (which pays) without the manifest changing. Turning them on in
  # the cell is its own go-live step, which sets this AND the profile. Outside Kubernetes it is not read.
  scheduled-tasks:
    allowed-on-kubernetes: "${SCHEDULED_TASKS_ALLOWED_ON_KUBERNETES:false}"

ndasenda:
  base-url: https://sandbox.deductions.ndasenda.co.zw
  auth-endpoint: "${ndasenda.base-url}/connect/token"
  deduction-requests-endpoint: "${ndasenda.base-url}/api/v1/deductions/requests"
  find-batch-endpoint: "${ndasenda.base-url}/api/v1/deductions/requests/{id}"
  commit-deductions-endpoint: "${ndasenda.base-url}/api/v1/deductions/requests/commit/{id}"
  deduction-requests-by-date-range-endpoint: "${ndasenda.base-url}/api/v1/deductions/requests/{fromDate}/{toDate}/{deductionCode}"
  deduction-responses-by-date-range-endpoint: "${ndasenda.base-url}/api/v1/deductions/responses/{fromDate}/{toDate}/{deductionCode}"
  deduction-responses-by-batch-id: "${ndasenda.base-url}/api/v1/deductions/responses/{id}"
  grant-type: password
  password: "${NDASENDA_PASSWORD:}"
  username: "${NDASENDA_USERNAME:}"
  security-code: "${NDASENDA_SECURITY_CODE:}"
  deduction-code: "${NDASENDA_DEDUCTION_CODE:}"
  # Lodging a deduction is irreversible, so only a lodgement that provably never reached Ndasenda is
  # tried again: up to max-attempts, backing off from retry-backoff-minutes (doubling), then FAILED.
  # Anything that may have reached Ndasenda is held as PROCESSING for its answer, never re-sent. A
  # claim left unsettled for stale-claim-minutes (a run that died mid-lodgement) is held the same way.
  lodgement:
    max-attempts: "${NDASENDA_LODGEMENT_MAX_ATTEMPTS:3}"
    retry-backoff-minutes: "${NDASENDA_LODGEMENT_RETRY_BACKOFF_MINUTES:10}"
    stale-claim-minutes: "${NDASENDA_LODGEMENT_STALE_CLAIM_MINUTES:30}"
  commit:
    deduction:
      batch:
        requests:
          cron: "0 */5 * * * ?"
  fetch:
    deduction:
      batch:
        responses:
          cron: "0 */10 * * * ?"
  # The response job reads from the oldest lodgement still awaiting Ndasenda's
  # answer (less a day) up to today, so a missed day is picked up by the next
  # run. lookback-days caps how far back one run reads: a lodgement that never
  # gets an answer would otherwise keep every run reading further back.
  # overdue-after-days: a lodgement waiting longer than this is logged at ERROR
  # and audited as NDASENDA_RESPONSE_OVERDUE, once per loan.
  responses:
    lookback-days: "${NDASENDA_RESPONSES_LOOKBACK_DAYS:45}"
    overdue-after-days: "${NDASENDA_RESPONSES_OVERDUE_AFTER_DAYS:7}"

innbucks:
  # The market this deployment serves (ZW, KE, ZM, MW, ZA, BW, MZ, LS, SZ, NG), from the cell's
  # INNBUCKS_COUNTRY like the ticketing services. It sets the market clock: the timezone API
  # timestamps are shown in and business dates are decided in (deduction month, report days).
  # Everything is stored in UTC regardless. An unknown value refuses to start.
  country: "${INNBUCKS_COUNTRY:ZW}"
  # Sign-in lockout, the ticketing user-service's defaults: this many consecutive wrong passwords
  # lock the account (423) for this long. A super-admin password reset lifts a lock early.
  account-lockout:
    max-attempts: "${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:7}"
    duration-minutes: "${ACCOUNT_LOCKOUT_DURATION_MINUTES:30}"
  api-key: "${INNBUCKS_API_KEY:}"
  username: "${INNBUCKS_USERNAME:}"
  password: "${INNBUCKS_PASSWORD:}"
  base-url: "${INNBUCKS_BASE_URL:https://staging.innbucks.co.zw}"
  # Login, apply and inquiry follow the InnBucks IT team's loans collection:
  # POST /auth/third-party (X-Api-Key + username/password -> accessToken), then
  # bearer + X-Api-Key on /bank/api/loan/**. The previous /auth/merchant/login
  # predates it and does not mint the PRE_APPROVED_LOAN_APPLICATION grant.
  auth-endpoint: "${innbucks.base-url}/auth/third-party"
  deposit-endpoint: "${innbucks.base-url}/api/transaction/deposit"
  create-loan-account-endpoint: "${innbucks.base-url}/bank/api/loan/apply/pre-approved"
  loan-inquiry-endpoint: "${innbucks.base-url}/bank/api/loan/inquiry/{participantReference}"
  # Which InnBucks product the loan is booked against. NANOUS is the value in
  # the IT collection; confirm it with InnBucks per deployment.
  loan-product: "${INNBUCKS_LOAN_PRODUCT:NANOUS}"
  # InnBucks books AND pays on the apply call, so each booking is claimed before it is sent and is
  # never sent twice. A claim left unsettled for stale-claim-minutes (a run that died mid-booking) is
  # held for the inquiry job as an unknown outcome, never booked again.
  booking:
    stale-claim-minutes: "${INNBUCKS_BOOKING_STALE_CLAIM_MINUTES:30}"

# --- Notifications ---------------------------------------------------------
# SMS and email are delivered through the InnBucks public notification API
# (X-Api-Key + third-party bearer), the same API and credentials the ticketing
# fleet sends through (its BANK_API_* values). Supply them via env in every
# deployed environment; blank, every SMS and email fails and is logged.
innbucks-notify:
  base-url: "${INNBUCKS_NOTIFY_URL:}"
  api-key: "${INNBUCKS_NOTIFY_API_KEY:}"
  username: "${INNBUCKS_NOTIFY_USERNAME:}"
  password: "${INNBUCKS_NOTIFY_PASSWORD:}"

# WhatsApp is delivered through the external WhatsApp notification gateway
# (x-api-key auth). Uses the same key names as the ticketing platform so one set
# of env values configures both — supply the values via env in every deployment.
whatsapp:
  base-url: "${WHATSAPP_GATEWAY_URL:}"
  api-key: "${WHATSAPP_API_KEY:}"
  connect-timeout-ms: "${WHATSAPP_CONNECT_TIMEOUT_MS:2000}"
  read-timeout-ms: "${WHATSAPP_READ_TIMEOUT_MS:10000}"

# The spec stays at the root /v3/api-docs: the fleet gateway serves it at /loans-service/v3/api-docs
# (StripPrefix=1) for its aggregated Swagger UI. Its single server comes from OpenApiConfig.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# --- Actuator: health only -------------------------------------------------
# For the cell's probes: readiness on /actuator/health, liveness on /actuator/health/liveness, on the
# app port like the other fleet services. Health is the ONLY endpoint exposed over HTTP, and it answers
# UP or DOWN with no details, so an anonymous caller learns nothing about the database or the disk.
# ApiSecurityConfig permits exactly /actuator/health and its subpaths; anything else under /actuator is
# not mapped at all.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

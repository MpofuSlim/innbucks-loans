spring.datasource.url=jdbc:mysql://localhost:3306/bulkit_loans
spring.datasource.username=root
spring.datasource.password=#pass123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.datasource.hikari.maximum-pool-size=19
spring.datasource.hikari.minimum-idle=7
spring.jpa.hibernate.ddl-auto=update
datasource.hikari.data-source-properties.stringtype=unspecified
server.error.whitelabel.enabled=false
#hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.org.hibernate.envers.default_schema=audit
spring.jpa.properties.hibernate.hbm2dll.create_namespaces=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.defer-datasource-initialization=false

encryption-key=${ENCRYPTION_KEY:}

encryption-key-v2=${ENCRYPTION_KEY_V2:}


ndasenda.base-url=https://sandbox.deductions.ndasenda.co.zw
ndasenda.auth-endpoint=${ndasenda.base-url}/connect/token
ndasenda.deduction-requests-endpoint=${ndasenda.base-url}/api/v1/deductions/requests
ndasenda.find-batch-endpoint=${ndasenda.base-url}/api/v1/deductions/requests/{id}
ndasenda.commit-deductions-endpoint=${ndasenda.base-url}/api/v1/deductions/requests/commit/{id}
ndasenda.deduction-requests-by-date-range-endpoint=${ndasenda.base-url}/api/v1/deductions/requests/{fromDate}/{toDate}/{deductionCode}
ndasenda.deduction-responses-by-date-range-endpoint=${ndasenda.base-url}/api/v1/deductions/responses/{fromDate}/{toDate}/{deductionCode}
ndasenda.deduction-responses-by-batch-id=${ndasenda.base-url}/api/v1/deductions/responses/{id}



ndasenda.commit.deduction.batch.requests.cron=0 */5 * * * ?
ndasenda.fetch.deduction.batch.responses.cron=0 */10 * * * ?


ndasenda.grant-type=password
ndasenda.password=${NDASENDA_PASSWORD:}
ndasenda.username=${NDASENDA_USERNAME:}
ndasenda.security-code=${NDASENDA_SECURITY_CODE:}
ndasenda.deduction-code=${NDASENDA_DEDUCTION_CODE:}

innbucks.username=${INNBUCKS_USERNAME:}
innbucks.password=${INNBUCKS_PASSWORD:}
innbucks.base-url=${INNBUCKS_BASE_URL:https://staging.innbucks.co.zw}
innbucks.auth-endpoint=${innbucks.base-url}/auth/merchant/login
innbucks.deposit-endpoint=${innbucks.base-url}/api/transaction/deposit
innbucks.api-key=${INNBUCKS_API_KEY:}

innbucks.create-loan-account-endpoint=${innbucks.base-url}/bank/api/loan/apply/pre-approved
innbucks.loan-inquiry-endpoint=${innbucks.base-url}/bank/api/loan/inquiry/{participantReference}
innbucks.loan-disbursement-status-check-rate=180000

spring.cache.type=caffeine
spring.cache.cache-names=ndasenda-access-token-cache,parameterCache,innbucks-access-token-cache
caffeine.cache.ndasenda-access-token-cache.spec=maximumSize=1000,expireAfterWrite=6h
caffeine.cache.parameterCache.spec=maximumSize=1000,expireAfterWrite=6h
caffeine.cache.innbucks-access-token-cache.spec=maximumSize=1000,expireAfterWrite=12m


detault.merchant.code=

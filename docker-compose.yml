name: innbucks-loans

# Local development stack for the loans platform.
#
#   docker compose up -d                 # just PostgreSQL (for `mvn spring-boot:run`)
#   docker compose --profile apps up -d  # PostgreSQL + the API
#
# The app service is opt-in (profile "apps") because it requires a jar to be
# built first. Build the jar before bringing it up:
#
#   mvn clean package -DskipTests
#   docker compose --profile apps up -d --build
#
# Copy .env.example to .env to override the defaults below.

services:
  postgres:
    image: postgres:16-alpine
    container_name: innbucks-loans-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-innbucks_loans}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-innbucks_loans}"]
      interval: 5s
      timeout: 3s
      retries: 20

  loans-api:
    profiles: ["apps"]
    build:
      context: ./loans-api
      dockerfile: Dockerfile
    image: loans-api:dev
    container_name: innbucks-loans-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The image always loads the packaged config (/app/config, empty here, is
      # only an overlay); override just the datasource so the app talks to the
      # postgres service instead of localhost. Same variable names as the
      # fleet cell's loans-service Deployment.
      # "local" opts this dev stack into the placeholder JWT secret and the
      # bootstrap admin's fallback password; both are refused without it.
      SPRING_PROFILES_ACTIVE: api,local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-innbucks_loans}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # The packaged server.port (application.yml, SERVER_PORT).
      - "8088:8088"

volumes:
  postgres_data:

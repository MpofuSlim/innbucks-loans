name: innbucks-loans

# Local development stack for the loans platform.
#
#   docker compose up -d                 # just PostgreSQL (for `mvn spring-boot:run`)
#   docker compose --profile apps up -d  # PostgreSQL + the API
#
# The app service is opt-in (profile "apps") because it requires a jar to be
# built first and the application context contacts an external Keycloak issuer
# at startup. Build the jar before bringing it up:
#
#   mvn clean package -DskipTests
#   docker compose --profile apps up -d --build
#
# Copy .env.example to .env to override the defaults below.

services:
  postgres:
    image: postgres:16-alpine
    container_name: innbucks-loans-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bulkit_loans}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bulkit_loans}"]
      interval: 5s
      timeout: 3s
      retries: 20

  loans-api:
    profiles: ["apps"]
    build:
      context: ./loans-api
      dockerfile: Dockerfile
    image: loans-api:dev
    container_name: innbucks-loans-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Load the packaged config, then override only the datasource so the app
      # talks to the postgres service instead of localhost. (The image's
      # default SPRING_CONFIG_LOCATION points at an empty /app/config mount.)
      SPRING_CONFIG_LOCATION: classpath:/application.yml
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bulkit_loans}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8080:8080"

volumes:
  postgres_data:

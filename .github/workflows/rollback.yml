name: Rollback

# Redeploys a service to EC2 at a previously-built commit SHA. The image
# ghcr.io/<owner>/<service>:<target_sha> must already exist in GHCR — i.e. a
# commit that release.yml (or the deploy workflows) previously pushed.
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Which service to roll back"
        required: true
        type: choice
        options:
          - loans-api
          - loans-embedded-ui
      target_sha:
        description: "Full 40-char commit SHA to roll back to (image pulled at tag <this>)."
        required: true
        type: string
      confirm:
        description: 'Type "rollback" to confirm. Guards against accidental clicks.'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ec2-deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back ${{ inputs.service }} to ${{ inputs.target_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.confirm }}" != "rollback" ]; then
            echo "::error::Confirmation phrase did not match 'rollback'. Aborting."
            exit 1
          fi
          if ! [[ "${{ inputs.target_sha }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a 40-character hex commit SHA, got: ${{ inputs.target_sha }}"
            exit 1
          fi
          echo "Rolling back ${{ inputs.service }} to ${{ inputs.target_sha }}"

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Setup known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Redeploy pinned image
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "OWNER='${{ github.repository_owner }}' \
             SERVICE='${{ inputs.service }}' \
             TARGET_SHA='${{ inputs.target_sha }}' \
             GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
             bash -s" <<'EOF'
            set -euo pipefail

            # Per-service runtime layout (matches the deploy-*.yml workflows).
            case "$SERVICE" in
              loans-api)
                CONTAINER=loans-api-container
                PORT_MAP=8080:8080
                ;;
              loans-embedded-ui)
                CONTAINER=loans-embedded-ui-container
                PORT_MAP=8081:8080
                ;;
              *)
                echo "::error::Unknown service: $SERVICE"; exit 1 ;;
            esac

            IMAGE="ghcr.io/${OWNER}/${SERVICE}:${TARGET_SHA}"
            echo "Rolling back $SERVICE to $IMAGE"

            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$OWNER" --password-stdin

            # Fail loudly if the target image does not exist, before tearing
            # down the running container.
            sudo docker pull "$IMAGE"

            sudo docker stop "$CONTAINER" || true
            sudo docker rm "$CONTAINER" || true
            sudo docker network create loans-network || true

            sudo docker run -d \
              --name "$CONTAINER" \
              --network loans-network \
              -p "$PORT_MAP" \
              -v "$HOME/apps/${SERVICE}/config:/app/config" \
              --restart unless-stopped \
              "$IMAGE"

            sudo docker logout ghcr.io || true
            sudo docker ps | grep "$CONTAINER"
          EOF

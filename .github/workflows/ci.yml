name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches:
      - "main"
      - "develop"
      - "claude/**"
      - "feature/**"
      - "release/**"
      - "hotfix/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Build the whole reactor and run the unit tests. The
      # @SpringBootTest contextLoads() test (LoansApiApplicationTests) boots
      # the full application context, which needs a live database —
      # unreachable from CI — so it is excluded here. Everything else
      # (compilation of both modules + the loans-core unit tests) runs.
      - name: Build + test
        run: >
          mvn -B -ntp clean verify
          -Dtest='!LoansApiApplicationTests'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 14

name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches:
      - "main"
      - "develop"
      - "claude/**"
      - "feature/**"
      - "release/**"
      - "hotfix/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Build the whole reactor and run the unit tests. The two
      # @SpringBootTest contextLoads() tests (LoansApiApplicationTests,
      # LoansEmbeddedUiApplicationTests) boot the full application context,
      # which eagerly contacts the Keycloak issuer and a live database — both
      # unreachable from CI — so they are excluded here. Everything else
      # (compilation of all three modules + the loans-core unit tests) runs.
      - name: Build + test
        run: >
          mvn -B -ntp clean verify
          -Dtest='!LoansApiApplicationTests,!LoansEmbeddedUiApplicationTests'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 14

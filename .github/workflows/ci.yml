name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches:
      - "main"
      - "develop"
      - "claude/**"
      - "feature/**"
      - "release/**"
      - "hotfix/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The JDK the image runs (loans-api/Dockerfile: eclipse-temurin:25-jre-alpine), an LTS,
      # so the tests run on what production runs. Bytecode still targets 21 (<java.version>,
      # compiled with <release>). Move this and the Dockerfile's base image together.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Build the whole reactor and run the unit tests. The
      # @SpringBootTest contextLoads() test (LoansApiApplicationTests) boots
      # the full application context, which needs a live database —
      # unreachable from CI — so it is excluded here. Everything else
      # (compilation of both modules + the loans-core unit tests) runs.
      # The *IT classes run once, in failsafe at verify, on a Testcontainers
      # Postgres (the runner has Docker). A -Dtest of exclusions alone makes
      # surefire include every class, so they are excluded from it by name.
      - name: Build + test
        run: >
          mvn -B -ntp clean verify
          -Dtest='!LoansApiApplicationTests,!*IT'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports/**'
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 14

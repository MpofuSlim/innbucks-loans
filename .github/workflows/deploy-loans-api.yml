name: Deploy Loans API to AWS EC2

# Workflow disabled - will only run when manually triggered
# on:
#   push:
#     branches:
#       - main
#     paths:
#       - 'loans-api/**'
#       - 'loans-core/**'
#       - 'pom.xml'

on: workflow_dispatch

# Add permissions for GitHub token
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Loans API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests -pl loans-api -am

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./loans-api
          file: ./loans-api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/loans-api:latest,ghcr.io/${{ github.repository_owner }}/loans-api:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/loans-api:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/loans-api:buildcache,mode=max

  deploy-approval:
    name: Deployment Approval
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deployment Approval
        run: echo "Deployment has been approved"

  deploy:
    name: Deploy to EC2
    needs: deploy-approval
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Setup known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Docker container
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            # Install Docker if not already installed
            if ! command -v docker &> /dev/null; then
              echo "Docker not found, installing..."
              sudo apt-get update
              sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
              sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io
              sudo usermod -aG docker $USER
              echo "Docker installed successfully"
            fi

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Pull the latest image
            sudo docker pull ghcr.io/${{ github.repository_owner }}/loans-api:latest

            # Stop and remove existing container if it exists
            sudo docker stop loans-api-container || true
            sudo docker rm loans-api-container || true

            # Create a Docker network if it does not exist
            sudo docker network create loans-network || true

            # Run the new container
            sudo docker run -d \
              --name loans-api-container \
              --network loans-network \
              -p 8080:8080 \
              -v ~/apps/loans-api/config:/app/config \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/loans-api:latest

            # Check if container is running
            sudo docker ps | grep loans-api-container
          '


# --- PostgreSQL (local development) ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.url=jdbc:postgresql://localhost:5432/bulkit_loans
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.hikari.maximum-pool-size=19
spring.datasource.hikari.minimum-idle=7
spring.jpa.hibernate.ddl-auto=update
datasource.hikari.data-source-properties.stringtype=unspecified
server.error.whitelabel.enabled=false
#hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.org.hibernate.envers.default_schema=audit
spring.jpa.properties.hibernate.hbm2dll.create_namespaces=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.defer-datasource-initialization=false

encryption-key=${ENCRYPTION_KEY:}
encryption-key-v2=${ENCRYPTION_KEY_V2:}


ndasenda.security-code=${NDASENDA_SECURITY_CODE:}
ndasenda.deduction-code=${NDASENDA_DEDUCTION_CODE:}

ndasenda.base-url=https://ndasenda-test.azurewebsites.net
ndasenda.auth-endpoint=${ndasenda.base-url}/connect/token
ndasenda.deduction-requests-endpoint=${ndasenda.base-url}/api/v1/deductions/requests
ndasenda.find-batch-endpoint=${ndasenda.base-url}/api/v1/deductions/requests/{id}
ndasenda.commit-deductions-endpoint=${ndasenda.base-url}/api/v1/deductions/requests/commit/{id}
ndasenda.find-batches-by-date-range-endpoint=${ndasenda.base-url}/api/v1/deductions/requests/{fromDate}/{toDate}/{deductionCode}
ndasenda.deduction-responses-by-date-range-endpoint=${ndasenda.base-url}/api/v1/deductions/responses/{fromDate}/{toDate}/{deductionCode}
ndasenda.deduction-responses-by-batch-id=${ndasenda.base-url}/api/v1/deductions/responses/{id}

innbucks.create-loan-account-endpoint=${innbucks.base-url}/bank/api/loan/apply/pre-approved

ndasenda.commit.deduction.batch.requests.cron=0 0 0,12 * * ?
ndasenda.fetch.deduction.batch.responses.cron=0 0 */3 * * ?

notification.username=${NOTIFICATION_USERNAME:autoloan@bulkit.co.zw}
notification.password=${NOTIFICATION_PASSWORD:}
notification.senderName=InnBucks


ndasenda.grant-type=password
ndasenda.password=${NDASENDA_PASSWORD:}
ndasenda.username=${NDASENDA_USERNAME:}



innbucks.username=${INNBUCKS_USERNAME:}
innbucks.password=${INNBUCKS_PASSWORD:}
innbucks.base-url=${INNBUCKS_BASE_URL:https://staging.innbucks.co.zw}
innbucks.auth-endpoint=${innbucks.base-url}/auth/merchant/login
innbucks.deposit-endpoint=${innbucks.base-url}/api/transaction/deposit
innbucks.api-key=${INNBUCKS_API_KEY:}


bulkit.client-id=${BULKIT_CLIENT_ID:}
bulkit.auth-url=${BULKIT_AUTH_URL:http://ec2-13-246-17-72.af-south-1.compute.amazonaws.com:8380}
bulkit.client-secret=${BULKIT_CLIENT_SECRET:}
bulkit.principal-attribute=preferred_username
bulkit.realm=${BULKIT_REALM:bulkit-loans-prod-realm}
bulkit.username=${BULKIT_USERNAME:admin}
bulkit.password=${BULKIT_PASSWORD:}


bulkit.loans.channel-id=${BULKIT_LOANS_CHANNEL_ID:}

#bulkit.auth-url=http://ec2-13-246-17-72.af-south-1.compute.amazonaws.com:8380/realms/bulkit-loans-prod-realm/protocol/openid-connect/token

spring.security.oauth2.client.registration.keycloak.client-id=${bulkit.client-id}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid

spring.security.oauth2.client.provider.keycloak.issuer-uri=${bulkit.auth-url}/realms/${bulkit.realm}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
spring.security.oauth2.resourceserver.jwt.issuer-uri=${spring.security.oauth2.client.provider.keycloak.issuer-uri}

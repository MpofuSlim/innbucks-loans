<!DOCTYPE html>
<html lang="zxx">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Link of CSS files -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/flaticon.css}"/>
    <link rel="stylesheet" th:href="@{/css/remixicon.css}"/>
    <link rel="stylesheet" th:href="@{/css/owl.carousel.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/odometer.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/magnific-popup.css}"/>
    <link rel="stylesheet" th:href="@{/css/fancybox.css}"/>
    <link rel="stylesheet" th:href="@{/css/aos.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
    <title>BulkIT</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
</head>

<body>
<!--Preloader starts-->
<div class="preloader js-preloader">
    <div class="loader loader-inner-1">
        <div class="loader loader-inner-2">
            <div class="loader loader-inner-3">
            </div>
        </div>
    </div>
</div>
<!--Preloader ends-->

<!-- Page Wrapper End -->
<div class="page-wrapper">

    <!-- Header Section Start -->
    <header class="header-wrap style2">
        <div class="header-bottom">
            <div class="container">
                <nav class="navbar navbar-expand-md navbar-light">
                    <div class="collapse navbar-collapse main-menu-wrap" id="navbarSupportedContent">
                        <div class="menu-close xl-none">
                            <a href="javascript:void(0)"> <i class="ri-close-line"></i></a>
                        </div>
                        <ul class="navbar-nav ms-auto">


                            <li class="nav-item">
                                <a href="#" class="nav-link">My Loan</a>
                            </li>
                            <li class="nav-item">
                                <a href="#" class="nav-link">Loan Calculator</a>
                            </li>
                            <li class="nav-item">
                                <a href="#" class="nav-link">Terms & Conditions</a>
                            </li>

                            <li class="nav-item xl-none">
                                <a th:href="@{/apply(mobileNumber=${#session.getAttribute('mobileNumber')})}" class="btn style2">Apply Now</a>
                            </li>
                        </ul>
                    </div>
                </nav>
                <div class="mobile-bar-wrap">
                    <div class="mobile-menu xl-none">
                        <a href="javascript:void(0)"><i class="ri-menu-line"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- Header Section End -->

    <!-- Content Wrapper Start -->
    <div class="content-wrapper">

        <!-- Error  Section start -->
        <div class="error-wrap mt-100 ptb-100">
            <div class="container">
                <div class="row">
                    <div class="col-lg-8 offset-lg-2">
                        <div class="error-content">
                            <h2>Oops! Request Rejected</h2>
                            <p>Your loan application was rejected. We understand your disappointment. Feel free to
                                contact us for further information.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Error  Section end -->

    </div>
    <!-- Content Wrapper End -->


</div>
<!-- Page Wrapper End -->

<!-- Back-to-top button Start -->
<a href="javascript:void(0)" class="back-to-top bounce"><i class="ri-arrow-up-s-line"></i></a>
<!-- Back-to-top button End -->

<!-- Link of JS files -->
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/form-validator.min.js}"></script>
<script th:src="@{/js/contact-form-script.js}"></script>
<script th:src="@{/js/aos.js}"></script>
<script th:src="@{/js/owl.carousel.min.js}"></script>
<script th:src="@{/js/odometer.min.js}"></script>
<script th:src="@{/js/jquery-magnific-popup.js}"></script>
<script th:src="@{/js/fancybox.js}"></script>
<script th:src="@{/js/jquery.appear.js}"></script>
<script th:src="@{/js/tweenmax.min.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>

</html>

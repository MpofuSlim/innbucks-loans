<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <!-- Mobile Specific Metas -->
    <meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport"/>
    <title>transfer</title>
    <link rel="shortcut icon" th:href="@{/images/logo.png}"/>
    <link rel="stylesheet" th:href="@{/fonts/fonts.css}"/>
    <link rel="stylesheet" th:href="@{/fonts/icons-alipay.css}">
    <link rel="stylesheet" th:href="@{/styles/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" type="text/css"/>

</head>

<body class="bg_surface_color">
<!-- preloade -->
<div class="preloader js-preloader">
    <div class="loader loader-inner-1">
        <div class="loader loader-inner-2">
            <div class="loader loader-inner-3">
            </div>
        </div>
    </div>
</div>
<!-- /preload -->
<div class="header is-fixed">
    <div class="tf-container">
        <div class="tf-statusbar d-flex justify-content-center align-items-center">
            <a class="back-btn" href="#"> <i class="icon-left"></i> </a>
            <h3>Loan Detail</h3>
        </div>
    </div>
</div>
<div id="app-wrap">
    <div class="bill-payment-content">
        <div class="tf-container">
            <div class="wrapper-bill">
                <div class="archive-top">
                         <span class="circle-box lg bg-circle check-icon">

                         </span>
                    <h1><a class="success_color" href="#" th:text="${loan.principal}">$ 21.5</a></h1>
                    <h3 class="mt-2 fw_6" th:text="${loan.reference}"></h3>
                </div>
                <div class="dashed-line"></div>
                <div class="archive-bottom">
                    <h2 class="text-center">Summary</h2>
                    <ul>
                        <li class="list-info-bill">Start Date <span th:text="${loan.repaymentStartDate}"></span></li>
                        <li class="list-info-bill">End Date <span th:text="${loan.repaymentEndDate}"></span></li>
                        <li class="list-info-bill">Approval Status <span
                                th:text="${loan.loanApprovalStatus}"></span>
                        </li>
                        <li class="list-info-bill">Disbursement Status <span
                                th:text="${loan.disbursementStatus}"></span>
                        </li>
                    </ul>
                </div>

            </div>


        </div>

    </div>
</div>

<div class="bottom-navigation-bar st1 bottom-btn-fixed" hidden>
    <div class="tf-container">
        <a class="tf-btn accent large" href="#">Done</a>
    </div>
</div>

<script th:src="@{/js/jquery.min.js}" type="text/javascript"></script>
<script th:src="@{/js/bootstrap.min.js}" type="text/javascript"></script>
<script th:src="@{/js/main.js}" th:version="${#dates.createNow().getTime()}" type="text/javascript"></script>
<script src="javascript/count-down.js" th:src="@{/js/count-down.js}" type="text/javascript"></script>

</body>

</html>

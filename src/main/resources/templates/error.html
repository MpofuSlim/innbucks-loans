<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <!-- Mobile Specific Metas -->
    <meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport"/>
    <title>successful</title>
    <!-- Favicon and Touch Icons  -->
    <link rel="shortcut icon" th:href="@{/images/logo.png}"/>
    <link rel="apple-touch-icon-precomposed" th:href="@{/images/logo.png}"/> <!-- Font -->
    <link rel="stylesheet" th:href="@{/fonts/fonts.css}"/> <!-- Icons -->
    <link rel="stylesheet" th:href="@{/fonts/icons-alipay.css}">
    <link rel="stylesheet" th:href="@{/styles/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/styles/styles.css}" type="text/css"/>
    <link rel="apple-touch-icon" sizes="192x192" th:href="@{/app/icons/icon-192x192.png}">
</head>

<body>
<!-- preloader -->
<div class="preloader js-preloader">
    <div class="loader loader-inner-1">
        <div class="loader loader-inner-2">
            <div class="loader loader-inner-3">
            </div>
        </div>
    </div>
</div>
<!-- /preload -->

<div class="wrap-success">


    <div class="success_box">
        <div class="icon-1 ani3">
            <span class="circle-box lg bg-critical"></span>
        </div>
        <div class="icon-2 ani5">
            <span class="circle-box md bg-critical"></span>
        </div>
        <div class="icon-3 ani8">
            <span class="circle-box md bg-critical"></span>
        </div>
        <div class="icon-4 ani2">
            <span class="circle-box sm bg-critical"></span>
        </div>


        <div class="content">
            <div class="top">
                <h2>Oops! Something went wrong</h2>
                <p class="fw_4">but rest assured, we are committed to resolving the issue and never intend to disappoint
                    you.</p>
            </div>


        </div>
        <a class="tf-btn accent large" href="home.html"  th:href="@{/loan(payload=${#session.getAttribute('payload')})}">Done</a>

    </div>

    <span class="line-through through-1"></span>
    <span class="line-through through-2"></span>
    <span class="line-through through-3"></span>
    <span class="line-through through-4"></span>
    <span class="line-through through-5"></span>
    <span class="line-through through-6"></span>

</div>


<script th:src="@{/js/jquery.min.js}" type="text/javascript"></script>
<script th:src="@{/js/bootstrap.min.js}" type="text/javascript"></script>
<script th:src="@{/js/main.js}" th:version="${#dates.createNow().getTime()}" type="text/javascript"></script>

</body>

</html>
